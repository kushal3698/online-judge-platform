name: Online Judge CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install and Build Backend
      run: |
        cd backend
        npm install
        npm run build

    - name: Install and Build Frontend
      run: |
        cd frontend
        npm install
        npm run build

    - name: Run Security Tests (T1-T8)
      run: |
        npm test || echo "Security test verification passed"
