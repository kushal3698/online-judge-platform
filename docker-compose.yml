version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: oj-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: online_judge
    volumes:
      - mongodb_data:/data/db
    networks:
      - oj-network

  # Redis In-Memory Queue Broker
  redis:
    image: redis:7-alpine
    container_name: oj-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - oj-network

  # Express REST API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oj-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/online_judge
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: super_secret_jwt_key_change_in_production_32char_minimum
      JWT_EXPIRES_IN: 24h
      CLIENT_URL: http://localhost:3000
    depends_on:
      - mongodb
      - redis
    networks:
      - oj-network

  # Asynchronous Queue Worker Node
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: oj-worker
    restart: always
    environment:
      MONGO_URI: mongodb://mongodb:27017/online_judge
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    depends_on:
      - mongodb
      - redis
    networks:
      - oj-network

networks:
  oj-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
